# =============================================================================
# docker-compose.yml — production-equivalent local stack
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#   docker compose logs -f app
# =============================================================================

services:

  # ─── MySQL database ─────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u${DB_USERNAME}", "-p${DB_PASSWORD}", "-h127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Laravel application (web + queue worker + scheduler) ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Named volume for user-uploaded files (storage/app/public)
      - storage_uploads:/var/www/html/storage/app/public
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  db_data:
    driver: local
  storage_uploads:
    driver: local

networks:
  # Containers on 'internal' can reach each other but not the host network directly
  internal:
    driver: bridge
    internal: true
  # 'public' is for services that must be reachable from the host
  public:
    driver: bridge
