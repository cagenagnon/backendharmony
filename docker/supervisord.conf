; Supervisord configuration — manages nginx, php-fpm, queue worker, and scheduler
; All processes run as the non-root 'laravel' user.

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
chown=laravel:laravel

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
user=laravel

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ─── PHP-FPM ──────────────────────────────────────────────────────────────────
[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1
stopwaitsecs=30

; ─── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;" -c /etc/nginx/nginx.conf -p /var/run/nginx
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5
depends_on=php-fpm
stopwaitsecs=10

; ─── Queue worker ─────────────────────────────────────────────────────────────
; Disable by setting ENABLE_QUEUE_WORKER=false in the container environment.
; Default: on. Graceful shutdown waits up to 90s for in-flight jobs.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=90
stopsignal=TERM

; ─── Scheduler ────────────────────────────────────────────────────────────────
; Disable by setting ENABLE_SCHEDULER=false in the container environment.
; Default: on.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
stopwaitsecs=10
