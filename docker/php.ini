; PHP production-hardened configuration for containerised Laravel
; Based on php.ini-production distributed with PHP

[PHP]
; Engine settings
engine                   = On
short_open_tag           = Off
precision                = 14
serialize_precision      = -1
output_buffering         = 4096
zlib.output_compression  = Off

; Resource limits
max_execution_time       = 60
max_input_time           = 60
memory_limit             = 256M

; Error handling — log only, never display in production
error_reporting          = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors           = Off
display_startup_errors   = Off
log_errors               = On
error_log                = /proc/1/fd/2
ignore_repeated_errors   = Off
ignore_repeated_source   = Off
report_memleaks          = On

; Upload
file_uploads             = On
upload_max_filesize      = 20M
max_file_uploads         = 20
post_max_size            = 25M

; Misc
default_charset          = "UTF-8"
default_socket_timeout   = 30

; Date
date.timezone            = UTC

; Session (not used in stateless API, kept safe)
session.use_strict_mode  = 1

[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.revalidate_freq        = 0
; Never check file timestamps in production — files don't change in a container
opcache.validate_timestamps    = 0
opcache.save_comments          = 1
opcache.fast_shutdown          = 1
